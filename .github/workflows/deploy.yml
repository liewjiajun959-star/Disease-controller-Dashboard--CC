name: Deploy HantaWatch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache is omitted intentionally — avoids failure when package-lock.json is missing

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json — running npm ci"
            npm ci --legacy-peer-deps
          else
            echo "No package-lock.json — running npm install"
            npm install --legacy-peer-deps
          fi

      - name: Type check
        run: npm run type-check --if-present

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Disease-controller-Dashboard--CC
          NODE_ENV: production

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
